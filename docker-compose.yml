# model-hub single-host deployment (tech doc §11, decided 2026-10-28):
# co-hosted with the zeus/loom stack on the same machine; loopback-only
# binding, Caddy terminates HTTPS over Tailscale/LAN only.
services:
  model-hub:
    build:
      context: .
      dockerfile: Dockerfile
    # Tag hook for rolling back code. Releasing means tagging the built image
    # with a stamp (`docker tag model-hub:latest model-hub:<stamp>`) before the
    # next build overwrites `latest`; a rollback sets HUB_IMAGE_TAG to that
    # stamp and reruns `docker compose up -d`.
    image: model-hub:${HUB_IMAGE_TAG:-latest}
    container_name: model-hub
    environment:
      HUB_MASTER_KEY: ${HUB_MASTER_KEY:?set HUB_MASTER_KEY in the repo-root .env}
      HUB_ADMIN_PASSWORD: ${HUB_ADMIN_PASSWORD:?set HUB_ADMIN_PASSWORD in the repo-root .env}
      HUB_PORT: "8791"
      HUB_DATA_DIR: /data
    ports:
      # Bind to loopback only; Caddy/Tailscale handles external exposure.
      - "127.0.0.1:8791:8791"
    volumes:
      - model-hub-data:/data
    restart: unless-stopped
    # The image is Node-only (no curl/wget), so probe with node's own fetch. A
    # green healthcheck means the process is serving HTTP, not merely alive —
    # without it a wedged server looks identical to a healthy one from outside.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8791/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Bounded logs: a long-running hub must not fill the host disk with stdout.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # tier0-net is the shared product network. Zeus addresses the hub as
    # http://model-hub:8791 and its outbound guard requires a resolvable DNS
    # name, so the hub must be a first-class member rather than attached
    # out-of-band with `docker network connect` (that attachment is runtime
    # state and disappears whenever this service is recreated).
    networks:
      - default
      - tier0-net

  # SQLite snapshot loop (scripts/backup-hub.sh): consistent .backup copies to
  # a host-mounted dir, pruned after RETENTION_DAYS.
  backup:
    # Same pinned image as the app stages (Node 22.23.4); digest rationale in
    # the Dockerfile header.
    image: node:22-slim@sha256:de170b39439eb0e5a3444ad7d60b015614a381e10fecae2e30ec9e735122f38d
    depends_on:
      - model-hub
    volumes:
      - model-hub-data:/data:ro
      # Snapshot destination on the host. Defaults to ./backups so a plain
      # checkout keeps working; set HUB_BACKUP_DIR in .env to point at a place
      # that survives the repo directory being wiped or moved.
      - ${HUB_BACKUP_DIR:-./backups}:/backups
      - ./scripts/backup-hub.sh:/scripts/backup-hub.sh:ro
    environment:
      BACKUP_INTERVAL_SECONDS: ${HUB_BACKUP_INTERVAL_SECONDS:-86400}
      RETENTION_DAYS: ${HUB_BACKUP_RETENTION_DAYS:-7}
    entrypoint: ["sh", "/scripts/backup-hub.sh"]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  model-hub-data:

networks:
  tier0-net:
    external: true
