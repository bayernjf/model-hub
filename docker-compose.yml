# model-hub single-host deployment (tech doc §11, decided 2026-10-28):
# co-hosted with the zeus/loom stack on the same machine; loopback-only
# binding, Caddy terminates HTTPS over Tailscale/LAN only.
services:
  model-hub:
    build:
      context: .
      dockerfile: Dockerfile
    # Tag hook for rolling back code. Releasing means tagging the built image
    # with a stamp (`docker tag model-hub:latest model-hub:<stamp>`) before the
    # next build overwrites `latest`; a rollback sets HUB_IMAGE_TAG to that
    # stamp and reruns `docker compose up -d`.
    image: model-hub:${HUB_IMAGE_TAG:-latest}
    container_name: model-hub
    environment:
      HUB_MASTER_KEY: ${HUB_MASTER_KEY:?set HUB_MASTER_KEY in the repo-root .env}
      HUB_ADMIN_PASSWORD: ${HUB_ADMIN_PASSWORD:?set HUB_ADMIN_PASSWORD in the repo-root .env}
      HUB_PORT: "8791"
      HUB_DATA_DIR: /data
    ports:
      # Bind to loopback only; Caddy/Tailscale handles external exposure.
      - "127.0.0.1:8791:8791"
    volumes:
      - model-hub-data:/data
    restart: unless-stopped

  # SQLite snapshot loop (scripts/backup-hub.sh): consistent .backup copies to
  # a host-mounted ./backups dir, pruned after RETENTION_DAYS.
  backup:
    # Same pinned image as the app stages (Node 22.23.4); digest rationale in
    # the Dockerfile header.
    image: node:22-slim@sha256:de170b39439eb0e5a3444ad7d60b015614a381e10fecae2e30ec9e735122f38d
    depends_on:
      - model-hub
    volumes:
      - model-hub-data:/data:ro
      - ./backups:/backups
      - ./scripts/backup-hub.sh:/scripts/backup-hub.sh:ro
    environment:
      BACKUP_INTERVAL_SECONDS: ${HUB_BACKUP_INTERVAL_SECONDS:-86400}
      RETENTION_DAYS: ${HUB_BACKUP_RETENTION_DAYS:-7}
    entrypoint: ["sh", "/scripts/backup-hub.sh"]
    restart: unless-stopped

volumes:
  model-hub-data:
